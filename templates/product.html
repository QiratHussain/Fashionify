{% extends "base.html" %}
{% block content %}
<h2>
    {{product_name}}
</h2>
<ul>
    {% if items %}
    {% for item in items %}
    <li>
        <div>
            <ul>
                <h4>{{item.title}} </h4> <h5>{{item.price}} </h5>
                <h5>{{item.subtitle}} </h5>

            </ul>
        </div>
    </li>
    {% endfor %}
    {% else %}
    <p>Not found</p>
    {% endif %}
</ul>
{% endblock %}
