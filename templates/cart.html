{% extends "base.html" %}
{% block content %}
<div style="width:100%; max-width:none; padding:20px;">
  <h2>Your Cart</h2>

  <table style="width:100%; border-collapse:collapse;">
    <thead>
      <tr style="text-align:left; border-bottom:2px solid #ddd;">
        <th style="padding:10px;">Product</th>
        <th style="padding:10px;">Name</th>
        <th style="padding:10px;">Price</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px;">
          <img src="{{ item.product.img_url }}" width="120" alt="{{ item.name }}">
        </td>
        <td style="padding:10px;">{{ item.name }}</td>
        <td style="padding:10px;">${{ item.product.price }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <h3 style="text-align:right; margin-top:20px;">
    Total: ${{ items | sum(attribute='product.price') }}
  </h3>

  <div style="text-align:right; margin-top:15px;">
    <a href="{{ url_for('checkout') }}"
       style="display:inline-block; padding:12px 30px; background:#e0b0ff; color:#fff;
              text-decoration:none; border-radius:5px; font-size:16px;">
      Checkout
    </a>
  </div>
</div>
{% endblock %}
