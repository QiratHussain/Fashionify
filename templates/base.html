<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fashionify{% endblock %}</title>
    <style>
        /* Color Palette & Base Reset */
        :root {
            --bg-white: #ffffff;
            --baby-pink: #f4c2c2;
            --light-purple: #e0b0ff;
            --soft-pink-bg: #fff5f7;
            --soft-purple-bg: #f8f0fc;
            --text-dark: #333333;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-white);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Navigation */
        header {
            background: linear-gradient(90deg, var(--soft-pink-bg), var(--soft-purple-bg));
            border-bottom: 2px solid var(--baby-pink);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: bold;
            text-decoration: none;
            background: linear-gradient(45deg, #d87093, #9370db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        nav a:hover {
            background-color: var(--baby-pink);
            color: var(--bg-white);
        }

        .cart-link {
            background-color: var(--light-purple);
            color: var(--text-dark);
        }

        .cart-link:hover {
            background-color: #c88cf5;
        }

        /* Main Content Area */
        main {
            flex: 1;
        }

        /* Hero Section */
        .hero {
            position: relative;
            width: 100%;
            height: 400px;
            background-color: var(--soft-purple-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Body Text Section */
        .content-section {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 5%;
            text-align: center;
        }

        .content-section h1 {
            font-size: 2.5rem;
            color: #b565a7;
            margin-bottom: 0.5rem;
        }

        .content-section h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .content-section p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-dark);
            margin-bottom: 1.2rem;
            text-align: left;
        }

        /* Footer */
        footer {
            background: linear-gradient(90deg, var(--soft-purple-bg), var(--soft-pink-bg));
            border-top: 2px solid var(--light-purple);
            text-align: center;
            padding: 1.2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="/" class="brand-logo">Fashionify</a>
        <nav>
            <ul>
                <li><a href="/login">Login</a></li>
                <li><a href="/signup">Signup</a></li>
                <li><a href="/logout">Logout</a></li>
                <li><a href="/cart" class="cart-link">My Cart</a></li>
            </ul>
        </nav>
    </header>

{% block content %}
{% endblock %}


    <!-- Footer -->
    <footer>
        &copy; 2026 Fashionify. All rights reserved.
    </footer>

</body>
</html>
