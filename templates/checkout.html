{% extends "base.html" %}
{% block content %}
<div style="width:100%; max-width:none; padding:20px;">
  <h2>Checkout</h2>

  <table style="width:100%; border-collapse:collapse;">
    <thead>
      <tr style="text-align:left; border-bottom:2px solid #ddd;">
        <th style="padding:10px;">Product</th>
        <th style="padding:10px;">Name</th>
        <th style="padding:10px;">Price</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px;"><img src="{{ item.product.img_url }}" width="80" alt="{{ item.name }}"></td>
        <td style="padding:10px;">{{ item.name }}</td>
        <td style="padding:10px;">Rs. {{ item.product.price }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <h3 style="text-align:right; margin-top:20px;">Total: Rs. {{ total }}</h3>

  <form action="{{ url_for('home') }}" method="POST" style="text-align:right; margin-top:15px;">
    <button type="submit"
            style="padding:12px 30px; background:#b565a7; color:#fff; border:none;
                   border-radius:5px; font-size:16px; cursor:pointer;">
      Pay Now
    </button>
  </form>
</div>
{% endblock %}
